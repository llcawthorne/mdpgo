<!DOCTYPE html>
<html data-theme="light" data-code-style="github">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test Markdown File</title>
    <script>
      
      
      (() => {
        const osDark = matchMedia("(prefers-color-scheme: dark)");
        let choice = "auto";
        try { choice = sessionStorage.getItem("mdp-theme") || choice; } catch {}
        const apply = () => {
          document.documentElement.dataset.theme =
            choice === "auto" ? (osDark.matches ? "dark" : "light") : choice;
          document.dispatchEvent(new Event("mdp-theme"));
        };
        apply();
        osDark.addEventListener("change", () => { if (choice === "auto") apply(); });
        window.mdpSetTheme = (theme) => {
          choice = theme;
          try { sessionStorage.setItem("mdp-theme", theme); } catch {}
          apply();
        };
      })();
    </script>

/* GitHub-like page styles, light colors; github-dark.css swaps in dark ones */
:root {
  color-scheme: light;
  --fg: #1f2328;
  --bg: #ffffff;
  --muted: #59636e;
  --border: #d1d9e0;
  --border-muted: #d1d9e0b3;
  --code-bg: #818b981f;
  --pre-bg: #f6f8fa;
  --link: #0969da;
  --search-hit: #fff8c5;
  --search-hit-current: #f2cc60;
  --alert-note: #0969da;
  --alert-tip: #1a7f37;
  --alert-important: #8250df;
  --alert-warning: #9a6700;
  --alert-caution: #d1242f;
}

/* on html rather than body, so a printed page's margins get it too */
html {
  background: var(--bg);
}

body {
  margin: 0;
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
    Helvetica, Arial, sans-serif;
}

/* top bar: contents toggle, title, code style menu, print */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  box-sizing: border-box;
  height: 48px;
  padding: 0 12px;
  font-size: 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-muted);
}

.topbar-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-weight: 600;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  color: var(--muted);
  background: none;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}

.icon-button:hover,
.icon-button[aria-expanded="true"] {
  color: var(--fg);
  background: var(--code-bg);
}

.topbar select {
  padding: 4px 6px;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}

/* the theme button shows a moon in light mode and a sun in dark */
[data-theme="dark"] .icon-button .when-light,
[data-theme="light"] .icon-button .when-dark {
  display: none;
}

/* search, dropped down from the top bar */
.search {
  position: fixed;
  top: 48px;
  right: 0;
  left: 0;
  z-index: 15;
  padding: 12px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-muted);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
}

.search[hidden] {
  display: none;
}

.search-inner {
  max-width: 890px;
  margin: 0 auto;
}

.search input {
  box-sizing: border-box;
  width: 100%;
  padding: 8px 12px;
  font: inherit;
  font-size: 16px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.search input:focus {
  outline: 2px solid var(--link);
  outline-offset: -1px;
}

.search-summary {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.search-summary:empty {
  display: none;
}

.search-results {
  max-height: 60vh;
  margin: 8px 0 0;
  padding: 0;
  overflow-y: auto;
  list-style: none;
}

.search-results li {
  padding: 8px 12px;
  font-size: 14px;
  line-height: 1.4;
  border-radius: 6px;
  cursor: pointer;
}

.search-results li:hover,
.search-results li.selected {
  background: var(--code-bg);
}

.search-heading {
  display: block;
  margin-bottom: 2px;
  font-weight: 600;
}

.search-text {
  color: var(--muted);
}

.search-results mark {
  color: inherit;
  background: var(--search-hit);
}

::highlight(mdp-search) {
  color: inherit;
  background-color: var(--search-hit);
}

/* the passage a search result jumped to, flashed */
@keyframes search-flash {
  from {
    background-color: var(--search-hit-current);
  }
}

.search-target {
  animation: search-flash 1.5s ease-out;
  border-radius: 4px;
}

/* the table of contents slides in from the left; on wide windows the
   article moves over to make room, on narrow ones it covers the article */
.toc {
  position: fixed;
  top: 48px;
  bottom: 0;
  left: 0;
  z-index: 10;
  box-sizing: border-box;
  width: 280px;
  overflow-y: auto;
  padding: 24px 16px;
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  border-right: 1px solid var(--border-muted);
  transform: translateX(-100%);
  visibility: hidden;
}

.ready .toc {
  transition: transform 0.2s, visibility 0.2s;
}

.toc-open .toc {
  transform: none;
  visibility: visible;
}

@media (min-width: 1024px) {
  .toc-open .page {
    padding-left: 280px;
  }
}

.toc-title {
  margin: 0 0 8px;
  font-weight: 600;
}

.toc ul {
  margin: 0;
  padding-left: 0;
  list-style: none;
}

.toc ul ul {
  padding-left: 1em;
}

.toc li {
  margin: 4px 0;
}

/* block, so all of a wrapped entry is clickable, not just its text */
.toc a {
  display: block;
  color: var(--muted);
  text-decoration: none;
}

.toc a:hover {
  color: var(--link);
}

.markdown-body {
  box-sizing: border-box;
  max-width: 980px;
  margin: 0 auto;
  padding: 32px 45px 45px;
  font-size: 16px;
  line-height: 1.5;
  word-wrap: break-word;
}

@media (max-width: 767px) {
  .markdown-body {
    padding: 15px;
  }
}

.markdown-body > *:first-child {
  margin-top: 0;
}

.markdown-body a {
  color: var(--link);
  text-decoration: none;
}

.markdown-body a:hover {
  text-decoration: underline;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  position: relative;
  /* clear the top bar when jumped to */
  scroll-margin-top: 64px;
  margin-top: 24px;
  margin-bottom: 16px;
  font-weight: 600;
  line-height: 1.25;
}

.markdown-body h1,
.markdown-body h2 {
  padding-bottom: 0.3em;
  border-bottom: 1px solid var(--border-muted);
}

.markdown-body h1 { font-size: 2em; }
.markdown-body h2 { font-size: 1.5em; }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body h4 { font-size: 1em; }
.markdown-body h5 { font-size: 0.875em; }
.markdown-body h6 { font-size: 0.85em; color: var(--muted); }

.markdown-body p,
.markdown-body blockquote,
.markdown-body ul,
.markdown-body ol,
.markdown-body dl,
.markdown-body table,
.markdown-body pre {
  margin-top: 0;
  margin-bottom: 16px;
}

.markdown-body blockquote {
  margin-left: 0;
  margin-right: 0;
  padding: 0 1em;
  color: var(--muted);
  border-left: 0.25em solid var(--border);
}

.markdown-body ul,
.markdown-body ol {
  padding-left: 2em;
}

.markdown-body ul ul,
.markdown-body ul ol,
.markdown-body ol ol,
.markdown-body ol ul {
  margin-top: 0;
  margin-bottom: 0;
}

.markdown-body li + li {
  margin-top: 0.25em;
}

.markdown-body li:has(> input[type="checkbox"]) {
  list-style-type: none;
}

.markdown-body li > input[type="checkbox"] {
  margin: 0 0.2em 0.25em -1.4em;
  vertical-align: middle;
}

.markdown-body hr {
  height: 0.25em;
  margin: 24px 0;
  padding: 0;
  background: var(--border);
  border: 0;
}

.markdown-body code,
.markdown-body pre {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  font-size: 85%;
}

.markdown-body code {
  padding: 0.2em 0.4em;
  background: var(--code-bg);
  border-radius: 6px;
}

.markdown-body pre {
  padding: 16px;
  overflow: auto;
  line-height: 1.45;
  border-radius: 6px;
}

/* :where() takes away this rule's specificity, so a highlight style's own
   background (on .chroma) wins over it */
:where(.markdown-body pre) {
  background: var(--pre-bg);
}

.markdown-body pre code {
  padding: 0;
  font-size: 100%;
  background: transparent;
}

.markdown-body table {
  display: block;
  width: max-content;
  max-width: 100%;

  border-spacing: 0;
  border-collapse: collapse;
}

.markdown-body th,

}

.markdown-body th {

.markdown-body tr:nth-child(2n) {

}

.markdown-body img {

}

.markdown-body .markdown-alert {

  border-left: 0.25em solid var(--alert-color);
}

.markdown-body .markdown-alert > :last-child {
  margin-bottom: 0;
}

.markdown-alert-title {
  display: flex;
  align-items: center;
  font-weight: 500;
  color: var(--alert-color);
}

.markdown-alert-title::before {
  content: "";
  width: 16px;
  height: 16px;
  margin-right: 8px;
  background: currentColor;
  -webkit-mask: var(--alert-icon) center / contain no-repeat;
  mask: var(--alert-icon) center / contain no-repeat;

.markdown-alert-note {

}

/* footnotes */
.markdown-body .footnotes {
  margin-top: 32px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--border);
}

.markdown-body .footnotes > hr {
  display: none;
}

.markdown-body .footnotes ol {
  padding-left: 16px;
}

.markdown-body sup > .footnote-ref::before {
  content: "[";
}

.markdown-body sup > .footnote-ref::after {
  content: "]";
}

/* keyboard keys */
.markdown-body kbd {
  display: inline-block;
  padding: 3px 5px;
  font: 11px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,

  line-height: 10px;
  vertical-align: middle;
  color: var(--fg);
  background: var(--pre-bg);
  border: 1px solid var(--border);

  border-radius: 6px;
  box-shadow: inset 0 -1px 0 var(--border);
}

.markdown-body .math-display {

  margin-bottom: 16px;
  overflow-x: auto;

}

.markdown-body pre.mermaid {

}

/* front matter, as a table */
.markdown-body .front-matter table {
  margin: 0;
}

/* images shown in only one mode; github-dark.css swaps these */
.markdown-body img.gh-dark-mode-only {
  display: none;
}

/* printing (and --pdf): just the article; PDFs get an outline instead of the
   table of contents, which viewers show in their sidebar */
/* Chrome doesn't paint backgrounds into a page's margins, which would leave
   dark pages with white edges; so the page has none, and .page's padding,
   repeated on every page, stands in for them */
@page {
  margin: 0;
}

@media print {
  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .topbar,
  .search,
  .toc {
    display: none;
  }

  .page,
  .toc-open .page {
    padding: 18mm 16mm;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  .markdown-body {
    max-width: none;
    padding: 0;
  }

  .markdown-body pre {
    white-space: pre-wrap;
    break-inside: avoid;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
    break-after: avoid;
  }

    <script>
      (() => {
        const root = document.documentElement;
        
        const store = {
          get(key) { try { return sessionStorage.getItem(key); } catch { return null; } },
          set(key, value) { try { sessionStorage.setItem(key, value); } catch {} },
        };

        const toggle = document.getElementById("toc-toggle");
        const setTOC = (open) => {
          root.classList.toggle("toc-open", open);
          toggle?.setAttribute("aria-expanded", open);
        };
        const savedTOC = store.get("mdp-toc");
        if (toggle && savedTOC) setTOC(savedTOC === "open");
        toggle?.addEventListener("click", () => {
          const open = !root.classList.contains("toc-open");
          setTOC(open);
          store.set("mdp-toc", open ? "open" : "closed");
        });

        
        
        const narrow = matchMedia("(max-width: 1023px)");
        for (const link of document.querySelectorAll("a[href^='#']")) {
          link.addEventListener("click", (event) => {
            const target = document.getElementById(decodeURIComponent(link.hash.slice(1)));
            if (!target) return;
            event.preventDefault();
            target.scrollIntoView();
            history.replaceState(null, "", link.hash);
            if (narrow.matches && link.closest(".toc")) setTOC(false);
          });
        }

        const menu = document.getElementById("code-style");
        const savedStyle = store.get("mdp-code-style");
        if (savedStyle && [...menu.options].some((o) => o.value === savedStyle)) {
          menu.value = root.dataset.codeStyle = savedStyle;
        }
        menu.addEventListener("change", () => {
          root.dataset.codeStyle = menu.value;
          store.set("mdp-code-style", menu.value);
        });

        document.getElementById("theme-toggle").addEventListener("click", () => {
          window.mdpSetTheme(root.dataset.theme === "dark" ? "light" : "dark");
        });

        document.getElementById("print").addEventListener("click", () => print());

        
        
        const search = document.getElementById("search");
        const searchToggle = document.getElementById("search-toggle");
        const input = document.getElementById("search-input");
        const summary = document.getElementById("search-summary");
        const list = document.getElementById("search-results");
        const article = document.querySelector(".markdown-body");
        const marks = window.CSS && CSS.highlights;
        let blocks = null;
        let results = [];
        let selected = -1;

        
        const index = () => {
          blocks = [];
          let heading = null;
          const all = "h1, h2, h3, h4, h5, h6, p, li, td, th, pre, dt, dd, summary, .math-display";
          for (const el of article.querySelectorAll(all)) {
            if (/^H[1-6]$/.test(el.tagName)) heading = el;
            if (el.querySelector("p, li, pre, table, h1, h2, h3, h4, h5, h6")) continue;
            const text = el.textContent.replace(/\s+/g, " ").trim();
            if (text) blocks.push({ el, text, lower: text.toLowerCase(), heading });
          }
        };

        const escape = (s) => s.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

        
        const mark = (text, terms) => {
          const lower = text.toLowerCase();
          let out = "";
          for (let i = 0; i < text.length; ) {
            let at = -1, len = 0;
            for (const t of terms) {
              const j = lower.indexOf(t, i);
              if (j >= 0 && (at < 0 || j < at)) { at = j; len = t.length; }
            }
            if (at < 0) { out += escape(text.slice(i)); break; }
            out += escape(text.slice(i, at)) + "<mark>" + escape(text.slice(at, at + len)) + "</mark>";
            i = at + len;
          }
          return out;
        };

        
        const excerpt = (block, terms) => {
          const at = Math.min(...terms.map((t) => block.lower.indexOf(t)));
          const start = Math.max(0, at - 50);
          const end = Math.min(block.text.length, at + 150);
          return (start > 0 ? "…" : "") + mark(block.text.slice(start, end), terms) +
            (end < block.text.length ? "…" : "");
        };

        const highlight = (terms) => {
          if (!marks) return;
          const ranges = [];
          const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT);
          for (let node; (node = walker.nextNode()); ) {
            const lower = node.data.toLowerCase();
            for (const t of terms) {
              for (let i = lower.indexOf(t); i >= 0; i = lower.indexOf(t, i + t.length)) {
                const range = new Range();
                range.setStart(node, i);
                range.setEnd(node, i + t.length);
                ranges.push(range);
              }
            }
          }
          marks.set("mdp-search", new Highlight(...ranges));
        };

        const select = (i) => {
          list.children[selected]?.classList.remove("selected");
          selected = i;
          const item = list.children[selected];
          item?.classList.add("selected");
          item?.scrollIntoView({ block: "nearest" });
        };

        const go = (i) => {
          const result = results[i];
          if (!result) return;
          closeSearch(false);
          result.el.scrollIntoView({ block: "center" });
          result.el.classList.remove("search-target");
          void result.el.offsetWidth; 
          result.el.classList.add("search-target");
        };

        const run = () => {
          blocks ??= (index(), blocks);
          const query = input.value.trim().toLowerCase();
          const terms = query.split(/\s+/).filter(Boolean);
          list.replaceChildren();
          selected = -1;
          if (query.length < 2) {
            results = [];
            summary.textContent = "";
            marks?.delete("mdp-search");
            return;
          }
          results = blocks.filter((b) => terms.every((t) => b.lower.includes(t)));
          summary.textContent = results.length === 1 ? "1 match" : results.length + " matches";
          for (const [i, result] of results.slice(0, 100).entries()) {
            const item = document.createElement("li");
            const where = result.heading && result.heading !== result.el
              ? result.heading.textContent.trim() : "";
            item.innerHTML = (where ? '<span class="search-heading">' + escape(where) + "</span>" : "") +
              '<span class="search-text">' + excerpt(result, terms) + "</span>";
            item.addEventListener("click", () => go(i));
            list.append(item);
          }
          highlight(terms);
        };

        const openSearch = () => {
          search.hidden = false;
          searchToggle.setAttribute("aria-expanded", "true");
          input.focus();
          input.select();
        };
        const closeSearch = (clear) => {
          search.hidden = true;
          searchToggle.setAttribute("aria-expanded", "false");
          if (clear) marks?.delete("mdp-search");
        };

        searchToggle.addEventListener("click", () => search.hidden ? openSearch() : closeSearch(true));
        input.addEventListener("input", run);
        input.addEventListener("keydown", (event) => {
          const count = Math.min(results.length, 100);
          if (event.key === "ArrowDown" && count) {
            event.preventDefault();
            select((selected + 1) % count);
          } else if (event.key === "ArrowUp" && count) {
            event.preventDefault();
            select((selected - 1 + count) % count);
          } else if (event.key === "Enter") {
            go(Math.max(selected, 0));
          } else if (event.key === "Escape") {
            closeSearch(true);
          }
        });
        document.addEventListener("keydown", (event) => {
          const typing = event.target.closest("input, select, textarea");
          if (!typing && !event.metaKey && !event.ctrlKey && !event.altKey &&
              (event.key === "/" || event.key === "s")) {
            event.preventDefault();
            openSearch();
          } else if (event.key === "Escape" && !search.hidden) {
            closeSearch(true);
          }
        });

        
        requestAnimationFrame(() => root.classList.add("ready"));
      })();
    </script>
  </body>
</html>
