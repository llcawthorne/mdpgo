<h1 id="images">Images</h1>
<p>Local image beside the file, embedded:</p>
<p><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAH0lEQVR4nAASAO3/Av8AAP8AAAAAAAAAAAAAAAAAAwAfFwIBJnyuSgAAAABJRU5ErkJggg==" alt="a dot"></p>
<p>Local image that doesn&#39;t exist, left alone:</p>
<p><img src="missing.png" alt="missing"></p>
<p>Remote image with a title, left alone:</p>
<p><img src="https://example.com/x.png" alt="remote" title="Remote Title"></p>
<p>Reference-style image: <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAH0lEQVR4nAASAO3/Av8AAP8AAAAAAAAAAAAAAAAAAwAfFwIBJnyuSgAAAABJRU5ErkJggg==" alt="ref image"></p>
<p>Image inside a link: <a href="https://example.com" rel="nofollow"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAH0lEQVR4nAASAO3/Av8AAP8AAAAAAAAAAAAAAAAAAwAfFwIBJnyuSgAAAABJRU5ErkJggg==" alt="linked dot"></a></p>
<p>Path with a space, URL-escaped: <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAH0lEQVR4nAASAO3/Av8AAP8AAAAAAAAAAAAAAAAAAwAfFwIBJnyuSgAAAABJRU5ErkJggg==" alt="spaced"></p>
